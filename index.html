<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Love Heart</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060208}body{display:grid;place-items:center}canvas{display:block;width:min(100vw,100vh);height:min(100vw,100vh)}
</style>
</head>
<body><canvas id="heart"></canvas>
<script>
(() => {
const canvas=document.getElementById('heart'),ctx=canvas.getContext('2d');
const BG='#060208', SC=21, OY=20, DURATION=10, GAP=7, SIZES=[9,10,11,12];
const phrases=["I love you","Seni seviyorum","Te amo","Je t'aime","Ich liebe dich","Ti amo","Eu te amo","Я тебя люблю","사랑해","愛してる","我爱你","मैं तुमसे प्यार करता हूँ","Σ' αγαπώ","Ik hou van jou","Jag älskar dig","Kocham cię","ฉันรักเธอ","Anh yêu em","Aku cinta kamu","Я тебе кохаю"];
let W=800,H=800,dpr=1,items=[],started=performance.now(),last=0,shimmerAt=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);const side=Math.min(innerWidth,innerHeight);canvas.style.width=side+'px';canvas.style.height=side+'px';canvas.width=Math.round(side*dpr);canvas.height=Math.round(side*dpr);W=H=side;ctx.setTransform(dpr,0,0,dpr,0,0);build();started=performance.now();}
function heart(a){return [16*Math.sin(a)**3*SC, (13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*SC+OY]}
function pathHeart(){ctx.beginPath();for(let i=0;i<=720;i++){let [x,y]=heart(i/720*Math.PI*2);x+=W/2;y=H/2-y;if(!i)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath()}
function inside(x,y){let xx=(x-400)/(16*SC), yy=((400-y)-OY)/(14.5*SC);return (xx*xx+yy*yy-1)**3-xx*xx*yy**3<=0}
function build(){items=[];let size=Math.min(W,H)/800, rowH=17*size;let scale= Math.min(1,(W-30)/(16*SC*2),(H-30)/(30*SC));
// Draw text heart in a normalized 800x800 coordinate system, scaled to fit.
const s=Math.min(W,H)/800;ctx.save();ctx.font='bold 12px Arial';
let rows=[];for(let y=120;y<690;y+=16){let spans=[],on=false,start=0;for(let x=40;x<760;x+=2){let hit=inside(x,y);if(hit&&!on){start=x;on=true}else if(!hit&&on){spans.push([start,x]);on=false}}if(on)spans.push([start,760]);for(const [lo,hi] of spans){let x=lo+Math.random()*5;while(x<hi-45){let text=phrases[Math.floor(Math.random()*phrases.length)],sz=SIZES[Math.floor(Math.random()*SIZES.length)];ctx.font=`bold ${sz}px Arial`;let width=ctx.measureText(text).width;if(x+width>hi)break;let c=Math.random();items.push({x:x+width/2,y,text,size:sz,w:width,delay:Math.random()*0.2,color: c<.5?'#b20b2e':c<.8?'#e81735':'#fa5267',dx:(Math.random()-.5)*16,edge:Math.abs(x-lo)<3||Math.abs(x+width-hi)<5});x+=width+GAP;}}}
// Sort from outer/edge letters to inner letters for a more heart-like reveal.
items.sort((a,b)=>(b.edge?1:0)-(a.edge?1:0));items.forEach((p,i)=>p.delay=i/items.length*DURATION);
ctx.restore();}
function draw(now){ctx.clearRect(0,0,W,H);const s=Math.min(W,H)/800;ctx.save();ctx.translate((W-800*s)/2,(H-800*s)/2);ctx.scale(s,s);
const elapsed=(now-started)/1000;
for(const p of items){let u=Math.max(0,Math.min(1,(elapsed-p.delay)/.65));if(u<=0)continue;let e=1-(1-u)**3,x=p.x+p.dx*(1-e),y=p.y-34*(1-e);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`bold ${p.size}px Arial`;ctx.fillStyle=BG;ctx.fillText(p.text,x+2,y+3);ctx.fillStyle=blend(BG,p.color,e);ctx.fillText(p.text,x,y);if(u<1){ctx.fillStyle=`rgba(255,199,199,${.5*Math.sin(Math.PI*u)})`;ctx.fillText(p.text,x,y)}}
if(elapsed>DURATION+1){if(now-shimmerAt>150){shimmerAt=now;const p=items[Math.floor(Math.random()*items.length)];if(p)p.flash=now}for(const p of items){if(p.flash&&now-p.flash<260){ctx.globalAlpha=.7*(1-(now-p.flash)/260);ctx.fillStyle='#ffc7c7';ctx.font=`bold ${p.size}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.text,p.x,p.y);ctx.globalAlpha=1}}}
ctx.restore();requestAnimationFrame(draw)}
function blend(a,b,k){const parse=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=parse(a),B=parse(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join('')}
addEventListener('resize',resize);resize();requestAnimationFrame(draw);
})();
</script></body></html>
